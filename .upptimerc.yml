# USB Platform Status — Upptime configuration
# Upptime is MIT-licensed open source: https://github.com/upptime/upptime
owner: cexplayer01 # Your GitHub organization or username, where this repository lives
repo: usb-status # The name of this repository

sites:
  - name: dfwmow.app (production site)
    url: https://dfwmow.app
  - name: Headless API — preview status (auth gate)
    url: https://dfwmow.app/api/usb/preview?job_id=publication-job-000000000000000000000000
    # Unauthenticated calls are rejected with 401 SIGN_IN_REQUIRED by design;
    # a 401 here means the API and its auth gate are up.
    expectedStatusCodes:
      - 401
  - name: Lab draft
    url: https://usb-lab--dfwmow.netlify.app
  - name: dfwmetro.net (sister property)
    url: https://dfwmetro.net
  - name: testmyself.app (sister property)
    url: https://testmyself.app

status-website:
  # No custom domain — the page is served from GitHub Pages under the repo path
  baseUrl: /usb-status
  name: USB Platform Status
  introTitle: "**USB Platform Status** — live uptime for the USB headless platform."
  introMessage: This page tracks the production site (dfwmow.app), the headless API's auth gate, the lab draft, and the sister properties dfwmetro.net and testmyself.app. It runs entirely on GitHub Actions, Issues, and Pages using [Upptime](https://github.com/upptime/upptime) — no server, nothing always-on.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
